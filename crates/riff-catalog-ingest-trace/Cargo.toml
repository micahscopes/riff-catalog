[package]
name = "riff-catalog-ingest-trace"
description = "Reads an fe trace bundle (JSONL): the origin graph as riff-catalog graphs, and a byte ledger joining emitted EVM bytes to Fe's own attribution. No hashing engine, so a producer can use it without linking riff-catalog-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
riff-catalog-schema.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
