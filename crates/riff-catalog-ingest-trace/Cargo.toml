[package]
name = "riff-catalog-ingest-trace"
description = "Reads an fe origin/provenance trace bundle (JSONL) into riff-catalog graphs. Ingests the origin graph only; every other trace fact kind is skipped. No hashing engine, so a producer can turn a bundle into graphs without linking riff-catalog-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
riff-catalog-schema.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
