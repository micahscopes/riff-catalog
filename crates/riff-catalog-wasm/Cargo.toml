[package]
name = "riff-catalog-wasm"
description = "Browser-side fingerprinting: lower solc output and digest it, compiled to wasm. solc itself runs separately as soljson; this consumes its output."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
palette = "0.7"
riff-catalog.workspace = true
riff-catalog-music.workspace = true
riff-catalog-core.workspace = true
riff-catalog-yul.workspace = true
riff-catalog-solidity.workspace = true
riff-catalog-evm.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
