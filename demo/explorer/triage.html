<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>riffcat · audit triage</title>
<style>
  :root {
    --bg: #0a0d0b; --bg-raise: #10140f; --bg-chip: #161b14;
    --line: #232b22; --line-bright: #36402f;
    --ink: #c8d3c0; --ink-dim: #6b7a64; --ink-faint: #424d3d;
    --a: #5df2a6; --a-dim: #1d4733;
    --novel: #ff6b5e; --novel-dim: #57231f;
    --warm: #ffb454;
    --mono: "Berkeley Mono", "JetBrains Mono", "Fira Code", "IBM Plex Mono",
            "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--mono);
    font-size: 14px; line-height: 1.45; min-height: 100vh;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px),
      radial-gradient(120% 90% at 50% 0%, rgba(255,107,94,0.045), transparent 60%);
  }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 28px 80px; }

  header.status {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px;
    border: 1px solid var(--line); background: var(--bg-raise);
    padding: 10px 16px; margin-bottom: 8px;
  }
  header.status .prog { color: var(--novel); font-weight: 700; letter-spacing: 0.04em; }
  header.status .prog::before { content: "▌"; animation: blink 1.2s steps(1) infinite; margin-right: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  header.status .crumb { color: var(--ink-dim); }
  header.status .crumb b { color: var(--ink); font-weight: 400; }
  header.status .spacer { flex: 1; }
  header.status .stamp { color: var(--ink-faint); font-size: 12px; }

  .punch { color: var(--ink-dim); margin: 0 2px 24px; font-size: 13px; }
  .punch em { color: var(--ink); font-style: normal; }

  .controls { display: flex; flex-wrap: wrap; gap: 22px; margin-bottom: 24px; }
  .panel { border: 1px solid var(--line); background: var(--bg-raise); padding: 12px 16px 14px; flex: 1; min-width: 280px; }
  .panel .label { color: var(--ink-faint); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 9px; }
  .panel button {
    font: inherit; color: var(--ink-dim); background: transparent;
    border: 1px solid var(--line); padding: 4px 11px; cursor: pointer; margin: 0 6px 6px 0;
  }
  .panel button:hover { color: var(--ink); border-color: var(--line-bright); }
  .panel button[aria-pressed="true"] { color: var(--bg); background: var(--a); border-color: var(--a); font-weight: 700; }
  .panel .sub { color: var(--ink-faint); font-size: 12px; }

  triage-readout { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-bottom: 18px; }
  @media (max-width: 880px) { triage-readout { grid-template-columns: repeat(2, 1fr); } }
  triage-readout .cell { border: 1px solid var(--line); background: var(--bg-raise); padding: 12px 16px 14px; }
  triage-readout .k { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); }
  triage-readout .v { font-size: 38px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--ink); }
  triage-readout .cell.mach .v { color: var(--a); }
  triage-readout .cell.novel { border-color: var(--novel-dim); }
  triage-readout .cell.novel .v { color: var(--novel); text-shadow: 0 0 22px rgba(255,107,94,0.35); }
  triage-readout .cell .pct { font-size: 16px; color: var(--ink-dim); }

  triage-strip { display: block; margin-bottom: 8px; }
  triage-strip .cells { display: flex; flex-wrap: wrap; gap: 3px; border: 1px solid var(--line); background: var(--bg-raise); padding: 10px; }
  triage-strip .f {
    width: 13px; height: 13px; cursor: default;
    background: var(--bg-chip); border: 1px solid var(--line);
    animation: land 240ms cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes land { from { opacity: 0; transform: scale(0.6); } }
  triage-strip .f.t0 { background: var(--novel); border-color: var(--novel); box-shadow: 0 0 7px rgba(255,107,94,0.5); }
  triage-strip .f.t1 { background: var(--warm); border-color: var(--warm); opacity: 0.85; }
  triage-strip .f.t2 { background: var(--a-dim); border-color: var(--a-dim); }
  triage-strip .f.t3 { background: var(--a); border-color: var(--a); opacity: 0.65; }
  triage-strip .legend { display: flex; gap: 18px; color: var(--ink-dim); font-size: 12px; margin: 7px 2px 26px; }
  triage-strip .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }

  triage-novel { display: block; }
  triage-novel h2 { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--novel); margin: 0 0 2px; }
  triage-novel .hint { color: var(--ink-faint); font-size: 12px; margin-bottom: 10px; }
  triage-novel .row {
    display: grid; grid-template-columns: minmax(220px, 1.4fr) 90px 1fr; gap: 14px;
    padding: 6px 10px; border-bottom: 1px solid var(--line); align-items: baseline;
    animation: land 240ms both;
  }
  triage-novel .row:hover { background: var(--bg-chip); }
  triage-novel .row .fn { color: var(--novel); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  triage-novel .row .nodes { color: var(--ink-faint); font-size: 12px; text-align: right; }
  triage-novel .row .ev { color: var(--ink-dim); font-size: 12px; }
  triage-novel .row .ev .st { color: var(--warm); }
  triage-novel .more { padding: 8px 10px; color: var(--ink-faint); font-size: 12px; }

  footer { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--line);
           color: var(--ink-dim); font-size: 12.5px; display: grid; gap: 6px; }
  footer .teach { color: var(--ink); }
  footer .teach em { color: var(--a); font-style: normal; }
  footer .teach em.n { color: var(--novel); }
  footer code { color: var(--ink); background: var(--bg-chip); padding: 0 5px; border: 1px solid var(--line); }
  footer a { color: var(--ink-dim); }
</style>
</head>
<body>
<main>
  <triage-app></triage-app>
</main>

<script src="./triage-data.js"></script>
<script>
"use strict";
/* riffcat audit triage — prototype of a verifier-platform feature.
 * Subject = a mainnet-verified contract. Every compiled function is checked
 * for twins elsewhere in the corpus at a facet: twins somewhere = machinery,
 * no twins = the novel surface. Vanilla web components, light DOM, no build. */

const T = window.RIFFCAT_TRIAGE;
const FACETS = {
  nb: { key: "nb", label: "names-blind", desc: "same shape, constants, types — names forgotten" },
  st: { key: "st", label: "structure", desc: "same shape only — the loosest dial stop" },
};
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tier = (n) => n === 0 ? "t0" : n <= 2 ? "t1" : n <= 9 ? "t2" : "t3";

class TriageReadout extends HTMLElement {
  set state({ subject, facet }) {
    const mach = subject.functions.filter((f) => f[facet].count > 0).length;
    const novel = subject.total - mach;
    this.innerHTML = `
      <div class="cell"><div class="k">compiled functions</div><div class="v">${subject.total}</div></div>
      <div class="cell mach"><div class="k">machinery — twins in corpus</div><div class="v">${mach}</div></div>
      <div class="cell novel"><div class="k">novel surface — read these</div><div class="v">${novel}</div></div>
      <div class="cell"><div class="k">machinery share</div><div class="v">${Math.round(100 * mach / subject.total)}<span class="pct">%</span></div></div>`;
  }
}

class TriageStrip extends HTMLElement {
  set state({ subject, facet }) {
    const fns = [...subject.functions].sort((x, y) => x[facet].count - y[facet].count);
    this.innerHTML = `
      <div class="cells">${fns.map((f, i) =>
        `<span class="f ${tier(f[facet].count)}" style="animation-delay:${Math.min(i * 3, 400)}ms"
               title="${esc(f.name)} — ${f[facet].count} twin${f[facet].count === 1 ? "" : "s"} elsewhere"></span>`).join("")}</div>
      <div class="legend">
        <span><i style="background:var(--novel)"></i>novel (0 twins)</span>
        <span><i style="background:var(--warm)"></i>rare (1–2)</span>
        <span><i style="background:var(--a-dim)"></i>common (3–9)</span>
        <span><i style="background:var(--a)"></i>everywhere (10+)</span>
        <span style="margin-left:auto">one cell per function · hover for names</span>
      </div>`;
  }
}

class TriageNovel extends HTMLElement {
  set state({ subject, facet }) {
    const novel = subject.functions.filter((f) => f[facet].count === 0);
    const cap = 40;
    this.innerHTML = `
      <h2>the novel surface — ${novel.length} function${novel.length === 1 ? "" : "s"}</h2>
      <div class="hint">no twin anywhere else in the corpus at ${FACETS[facet].label}; this is where reading time goes</div>
      ${novel.slice(0, cap).map((f, i) => {
        const stHint = facet === "nb" && f.st.count > 0
          ? `<span class="st">rhymes at structure</span> with ${esc(f.st.samples[0]?.name ?? "?")} (${esc(f.st.samples[0]?.home ?? "")}) — shape known, payload differs`
          : `no rhyme even at structure — genuinely new shape`;
        return `<div class="row" style="animation-delay:${Math.min(i * 12, 280)}ms">
          <span class="fn" title="${esc(f.name)}">${esc(f.name)}</span>
          <span class="nodes">${f.nodes} nodes</span>
          <span class="ev">${stHint}</span>
        </div>`;
      }).join("")}
      ${novel.length > cap ? `<div class="more">… ${novel.length - cap} more (full list in the JSON)</div>` : ""}`;
  }
}

class TriageApp extends HTMLElement {
  connectedCallback() {
    this.subject = 0;
    this.facet = "nb";
    this.innerHTML = `
      <header class="status">
        <span class="prog">riffcat·audit·triage</span>
        <span class="crumb">corpus <b>${T.corpus.yulFnRows.toLocaleString()} yul-fn fingerprints / ${T.corpus.files} artifact files</b></span>
        <span class="spacer"></span>
        <span class="stamp">prototype · rough on purpose</span>
      </header>
      <p class="punch"><em>Verified tells you the source matches the bytecode. Twins tell you which functions
        deserve your attention</em> — machinery the corpus has seen before is green; the novel surface is red.</p>
      <div class="controls">
        <div class="panel"><div class="label">subject — a mainnet-verified contract</div><div class="subjects"></div><div class="sub"></div></div>
        <div class="panel"><div class="label">facet</div><div class="facets"></div><div class="sub"></div></div>
      </div>
      <triage-readout></triage-readout>
      <triage-strip></triage-strip>
      <triage-novel></triage-novel>
      <footer>
        <span class="teach">Every function is <em>fingerprinted</em> per dimension; a function with a
          <em>twin</em> elsewhere in the corpus is machinery, and a function with <em class="n">no twin anywhere</em>
          is the part only this contract can explain. Same machinery, pointed at a verifier's
          full corpus, answers: <em class="n">“verified — but what's actually in it?”</em></span>
        <span>data: <code>generate-triage-data.py</code> over a riffcat corpus (9 local contracts + 6 mainnet sourcify ingests) ·
          pair view: <a href="./index.html">twin explorer</a></span>
      </footer>`;
    this.querySelector(".subjects").innerHTML = T.subjects.map((s, i) =>
      `<button type="button" data-i="${i}">${esc(s.label)}</button>`).join("");
    this.querySelector(".facets").innerHTML = Object.values(FACETS).map((f) =>
      `<button type="button" data-f="${f.key}">${f.label}</button>`).join("");
    this.onclick = (ev) => {
      const b = ev.target.closest("button");
      if (!b) return;
      if (b.dataset.i !== undefined) this.subject = Number(b.dataset.i);
      if (b.dataset.f) this.facet = b.dataset.f;
      this.render();
    };
    this.render();
  }
  render() {
    const subject = T.subjects[this.subject];
    this.querySelectorAll(".subjects button").forEach((b, i) =>
      b.setAttribute("aria-pressed", i === this.subject));
    this.querySelectorAll(".facets button").forEach((b) =>
      b.setAttribute("aria-pressed", b.dataset.f === this.facet));
    this.querySelector(".subjects + .sub").textContent =
      `${subject.address ?? ""} · solc ${subject.pin ?? "?"} · ${subject.match ?? ""}${subject.note ? " · " + subject.note : ""}`;
    this.querySelector(".facets + .sub").textContent = FACETS[this.facet].desc;
    const view = { subject, facet: this.facet };
    for (const tag of ["triage-readout", "triage-strip", "triage-novel"])
      this.querySelector(tag).state = view;
  }
}

customElements.define("triage-readout", TriageReadout);
customElements.define("triage-strip", TriageStrip);
customElements.define("triage-novel", TriageNovel);
customElements.define("triage-app", TriageApp);
</script>
</body>
</html>
