<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>riffcat · bundles</title>
<style>
  :root {
    --bg: #0a0d0b; --bg-raise: #10140f; --bg-chip: #161b14;
    --line: #232b22; --line-bright: #36402f;
    --ink: #c8d3c0; --ink-dim: #6b7a64; --ink-faint: #424d3d;
    --a: #5df2a6; --a-dim: #1d4733;
    --warm: #ffb454; --warm-dim: #4d3a1c;
    --cool: #7adfff;
    --mono: "Berkeley Mono", "JetBrains Mono", "Fira Code", "IBM Plex Mono",
            "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--mono);
    font-size: 14px; line-height: 1.45; min-height: 100vh;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px),
      radial-gradient(120% 90% at 50% 0%, rgba(122,223,255,0.04), transparent 60%);
  }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 28px 80px; }

  header.status {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px;
    border: 1px solid var(--line); background: var(--bg-raise);
    padding: 10px 16px; margin-bottom: 8px;
  }
  header.status .prog { color: var(--cool); font-weight: 700; letter-spacing: 0.04em; }
  header.status .prog::before { content: "▌"; animation: blink 1.2s steps(1) infinite; margin-right: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  header.status .crumb { color: var(--ink-dim); }
  header.status .crumb b { color: var(--ink); font-weight: 400; }
  header.status .spacer { flex: 1; }
  header.status .stamp { color: var(--ink-faint); font-size: 12px; }

  .punch { color: var(--ink-dim); margin: 0 2px 24px; font-size: 13px; }
  .punch em { color: var(--ink); font-style: normal; }

  .controls { display: flex; flex-wrap: wrap; gap: 22px; margin-bottom: 22px; }
  .panel { border: 1px solid var(--line); background: var(--bg-raise); padding: 12px 16px 14px; flex: 1; min-width: 260px; }
  .panel .label { color: var(--ink-faint); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 9px; }
  .panel button {
    font: inherit; color: var(--ink-dim); background: transparent;
    border: 1px solid var(--line); padding: 4px 11px; cursor: pointer; margin: 0 6px 6px 0;
  }
  .panel button:hover { color: var(--ink); border-color: var(--line-bright); }
  .panel button[aria-pressed="true"] { color: var(--bg); background: var(--cool); border-color: var(--cool); font-weight: 700; }
  .panel .sub { color: var(--ink-faint); font-size: 12px; }

  .split { display: grid; grid-template-columns: minmax(280px, 0.9fr) 1.6fr; gap: 22px; align-items: start; }
  @media (max-width: 920px) { .split { grid-template-columns: 1fr; } }

  bundle-picker { display: block; border: 1px solid var(--line); background: var(--bg-raise); }
  bundle-picker input {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg-chip);
    border: none; border-bottom: 1px solid var(--line); padding: 9px 12px; outline: none;
  }
  bundle-picker input::placeholder { color: var(--ink-faint); }
  bundle-picker .list { max-height: 560px; overflow-y: auto; }
  bundle-picker .fn {
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
    padding: 4px 12px; cursor: pointer; border-bottom: 1px solid rgba(35,43,34,0.5);
  }
  bundle-picker .fn:hover { background: var(--bg-chip); }
  bundle-picker .fn[aria-selected="true"] { background: var(--bg-chip); box-shadow: inset 2px 0 0 var(--cool); }
  bundle-picker .fn .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  bundle-picker .fn .b { color: var(--ink-faint); font-size: 11.5px; flex-shrink: 0; }
  bundle-picker .fn[aria-selected="true"] .n { color: var(--cool); }

  bundle-ladder { display: block; }
  bundle-ladder .fn-head { margin: 2px 2px 14px; }
  bundle-ladder .fn-head .name { color: var(--cool); font-size: 17px; font-weight: 700; word-break: break-all; }
  bundle-ladder .fn-head .meta { color: var(--ink-faint); font-size: 12px; }
  bundle-ladder .stop {
    border: 1px solid var(--line); background: var(--bg-raise);
    padding: 12px 16px 13px; margin-bottom: 10px; position: relative;
    animation: land 260ms cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes land { from { opacity: 0; transform: translateY(6px); } }
  bundle-ladder .stop::before {
    content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px;
    background: var(--stop-color, var(--a));
  }
  bundle-ladder .stop .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  bundle-ladder .stop .lbl { color: var(--ink); }
  bundle-ladder .stop .lbl b { color: var(--stop-color, var(--a)); font-weight: 700; }
  bundle-ladder .stop .count { margin-left: auto; font-size: 22px; font-weight: 700; color: var(--stop-color, var(--a)); font-variant-numeric: tabular-nums; }
  bundle-ladder .stop .count small { font-size: 12px; color: var(--ink-dim); font-weight: 400; }
  bundle-ladder .bar { height: 5px; background: var(--bg-chip); border: 1px solid var(--line); margin: 7px 0 9px; }
  bundle-ladder .bar i { display: block; height: 100%; background: var(--stop-color, var(--a)); transition: width 360ms cubic-bezier(.2,.9,.25,1); }
  bundle-ladder .homes { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
  bundle-ladder .home { background: var(--bg-chip); border: 1px solid var(--line); padding: 1px 8px; font-size: 12px; color: var(--ink-dim); }
  bundle-ladder .home b { color: var(--ink); font-weight: 400; }
  bundle-ladder .admit { color: var(--ink-faint); font-size: 12px; }
  bundle-ladder .admit .chips { display: inline; }
  bundle-ladder .admit .chip { color: var(--ink-dim); }
  bundle-ladder .admit .chip b { color: var(--stop-color, var(--a)); font-weight: 400; }
  bundle-ladder .alone { color: var(--ink-faint); font-size: 12.5px; }

  footer { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--line);
           color: var(--ink-dim); font-size: 12.5px; display: grid; gap: 6px; }
  footer .teach { color: var(--ink); }
  footer .teach em { color: var(--cool); font-style: normal; }
  footer code { color: var(--ink); background: var(--bg-chip); padding: 0 5px; border: 1px solid var(--line); }
  footer a { color: var(--ink-dim); }
</style>
</head>
<body>
<main>
  <bundle-app></bundle-app>
</main>

<script src="./bundle-data.js"></script>
<script>
"use strict";
/* riffcat bundles — "the same up to ___", made browsable. Pick a function;
 * each dial stop below shows the bundle of corpus objects equal to it at
 * that strictness, and which members the loosening admitted. Two levels:
 * the compiler's yul and the derived SSA form. Vanilla web components. */

const B = window.RIFFCAT_BUNDLE;
const UNITS = Object.keys(B.units);
const STOP_COLORS = { all: "var(--ink)", nb: "var(--a)", sc: "var(--warm)", st: "var(--cool)" };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

class BundlePicker extends HTMLElement {
  connectedCallback() {
    this.innerHTML = `<input type="search" placeholder="filter functions…"><div class="list"></div>`;
    this.querySelector("input").oninput = () => this.paint();
    this.querySelector(".list").onclick = (ev) => {
      const el = ev.target.closest(".fn");
      if (el) this.dispatchEvent(new CustomEvent("bundle:fn", { bubbles: true, detail: Number(el.dataset.i) }));
    };
  }
  set state({ functions, fn }) {
    this.functions = functions; this.selected = fn; this.paint();
  }
  paint() {
    const q = this.querySelector("input").value.toLowerCase();
    this.querySelector(".list").innerHTML = this.functions
      .map((f, i) => ({ f, i }))
      .filter(({ f }) => f.name.toLowerCase().includes(q))
      .slice(0, 400)
      .map(({ f, i }) => `<div class="fn" data-i="${i}" aria-selected="${i === this.selected}">
          <span class="n" title="${esc(f.name)}">${esc(f.name)}</span>
          <span class="b">⊂ ${f.ladder[f.ladder.length - 1].others + 1}</span>
        </div>`).join("");
  }
}

class BundleLadder extends HTMLElement {
  set state({ fn, functions, unit }) {
    const f = functions[fn];
    if (!f) { this.innerHTML = ""; return; }
    const max = Math.max(1, ...f.ladder.map((s) => s.others));
    const stopLabel = Object.fromEntries(B.stops.map((s) => [s.id, s.label]));
    this.innerHTML = `
      <div class="fn-head">
        <div class="name">${esc(f.name)}</div>
        <div class="meta">${f.nodes} nodes · ${esc(unit)} · bundle of ${f.ladder[f.ladder.length - 1].others + 1} at the loosest stop</div>
      </div>
      ${f.ladder.map((s, i) => {
        const color = STOP_COLORS[s.stop];
        const width = s.others === 0 ? 0 : Math.max(4, 100 * Math.log1p(s.others) / Math.log1p(max));
        const label = stopLabel[s.stop];
        const [head, ...rest] = label.split(" — ");
        const homes = s.homes.map((h) => `<span class="home"><b>${esc(h.home)}</b> ×${h.n}</span>`).join("")
          + (s.moreHomes ? `<span class="home">+${s.moreHomes} more places</span>` : "");
        const admitted = s.admitted === 0 ? "" :
          `<div class="admit">${i === 0 ? "identical twins:" : `forgetting ${i === 1 ? "names" : i === 2 ? "types & trace events" : "constants"} admitted`} <span class="chips">${
            s.samples.map((m) => `<span class="chip"><b>${esc(m.name)}</b> (${esc(m.home)})</span>`).join(", ")
          }${s.admitted > s.samples.length ? ` … +${s.admitted - s.samples.length} more` : ""}</span></div>`;
        return `<div class="stop" style="--stop-color:${color}; animation-delay:${i * 70}ms">
          <div class="head">
            <span class="lbl"><b>${esc(head)}</b>${rest.length ? " — " + esc(rest.join(" — ")) : ""}</span>
            <span class="count">${s.others === 0 ? "alone" : "+" + s.others}<small>${s.others ? " others" : ""}</small></span>
          </div>
          <div class="bar"><i style="width:${width}%"></i></div>
          ${s.others === 0
            ? `<div class="alone">nothing else in the corpus is ${i === 0 ? "identical" : "equal"} at this stop${i === 0 ? " — every bundle starts somewhere" : ""}</div>`
            : `<div class="homes">${homes}</div>${admitted}`}
        </div>`;
      }).join("")}`;
  }
}

class BundleApp extends HTMLElement {
  connectedCallback() {
    this.unit = UNITS[0]; this.subject = 0; this.fn = 0;
    this.innerHTML = `
      <header class="status">
        <span class="prog">riffcat·bundles</span>
        <span class="crumb">yul-fn <b>${B.units["yul-fn"].rows.toLocaleString()}</b> · yulssa-fn <b>${B.units["yulssa-fn"].rows.toLocaleString()}</b> fingerprints</span>
        <span class="spacer"></span>
        <span class="stamp">prototype · rough on purpose</span>
      </header>
      <p class="punch"><em>Every function belongs to a bundle of corpus objects that are the same “up to” something.</em>
        Pick one; each stop below loosens the dial and shows what the bundle gains — and from where.</p>
      <div class="controls">
        <div class="panel"><div class="label">subject contract</div><div class="subjects"></div></div>
        <div class="panel"><div class="label">level</div><div class="units"></div>
          <div class="sub">yul = the compiler's IR · yulssa = the derived SSA control-flow form</div></div>
      </div>
      <div class="split">
        <bundle-picker></bundle-picker>
        <bundle-ladder></bundle-ladder>
      </div>
      <footer>
        <span class="teach">Bundles are computed, not asserted: equality at a stop means the <em>fingerprints
          agree</em> on that stop's dimensions, transitively and by construction. Bundles can also grow by
          <em>claim</em> — witnessed, attributable, removable, optionally carrying fine print — none staged in
          this snapshot.</span>
        <span>data: <code>generate-bundle-data.py</code> over 9 local + 6 mainnet sourcify ingests ·
          siblings: <a href="./index.html">twin explorer</a> · <a href="./triage.html">audit triage</a></span>
      </footer>`;
    this.onclick = (ev) => {
      const b = ev.target.closest("button");
      if (!b) return;
      if (b.dataset.s !== undefined) { this.subject = Number(b.dataset.s); this.fn = 0; }
      if (b.dataset.u) { this.unit = b.dataset.u; this.subject = Math.min(this.subject, this.subjects().length - 1); this.fn = 0; }
      this.render();
    };
    this.addEventListener("bundle:fn", (ev) => { this.fn = ev.detail; this.render(); });
    this.render();
  }
  subjects() { return B.units[this.unit].subjects.filter((s) => s.functions.length); }
  render() {
    const subjects = this.subjects();
    const subject = subjects[this.subject];
    this.querySelector(".subjects").innerHTML = subjects.map((s, i) =>
      `<button type="button" data-s="${i}" aria-pressed="${i === this.subject}">${esc(s.label)} <small>(${s.functions.length})</small></button>`).join("");
    this.querySelector(".units").innerHTML = UNITS.map((u) =>
      `<button type="button" data-u="${u}" aria-pressed="${u === this.unit}">${esc(u)}</button>`).join("");
    const view = { functions: subject.functions, fn: this.fn, unit: this.unit };
    this.querySelector("bundle-picker").state = view;
    this.querySelector("bundle-ladder").state = view;
  }
}

customElements.define("bundle-picker", BundlePicker);
customElements.define("bundle-ladder", BundleLadder);
customElements.define("bundle-app", BundleApp);
</script>
</body>
</html>
