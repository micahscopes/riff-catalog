[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/micahscopes/riff-catalog"

[workspace.dependencies]
riff-catalog-schema = { path = "crates/riff-catalog-schema" }
riff-catalog-core = { path = "crates/riff-catalog-core" }
riff-catalog-exact = { path = "crates/riff-catalog-exact" }
riff-catalog-claims = { path = "crates/riff-catalog-claims" }
riff-catalog-view = { path = "crates/riff-catalog-view" }
riff-catalog-tool = { path = "crates/riff-catalog-tool" }

blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
sha2 = "0.10"
