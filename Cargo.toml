[workspace]
members = ["crates/*", "demo/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/micahscopes/riff-catalog"

[workspace.dependencies]
riff-catalog = { path = "crates/riff-catalog" }
riff-catalog-core = { path = "crates/riff-catalog-core" }
riff-catalog-schema = { path = "crates/riff-catalog-schema" }
riff-catalog-music = { path = "crates/riff-catalog-music" }
riff-catalog-claims = { path = "crates/riff-catalog-claims" }
riff-catalog-solc = { path = "crates/riff-catalog-solc" }
riff-catalog-yul = { path = "crates/riff-catalog-yul" }
riff-catalog-solidity = { path = "crates/riff-catalog-solidity" }
riff-catalog-evm = { path = "crates/riff-catalog-evm" }
riff-catalog-sourcify = { path = "crates/riff-catalog-sourcify" }

blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ureq = { version = "2", features = ["json", "tls"] }
semver = "1"
hex = "0.4"
sha2 = "0.10"
